<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — GTA VI Release Intelligence</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background:
        radial-gradient(900px 600px at 70% 0%, rgba(255, 46, 136, 0.2), transparent 60%),
        #07070a;
      color: #f4efe6;
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      text-align: center;
    }
    .wrap { max-width: 640px; }
    .mark {
      display: inline-grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 46, 136, 0.5);
      background: linear-gradient(145deg, rgba(255, 46, 136, 0.2), rgba(255, 122, 24, 0.08));
      font-family: Impact, sans-serif;
      font-size: 1.6rem;
    }
    p:first-of-type {
      margin: 0 0 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: #ff2e88;
    }
    h1 {
      margin: 0 0 16px;
      font-family: Impact, 'Arial Narrow', sans-serif;
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 400;
      line-height: 0.95;
      text-transform: uppercase;
    }
    p { color: #9996a3; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 46, 136, 0.5);
      color: #f4efe6;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover { background: #ff2e88; color: #07070a; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="mark">VI</span>
    <p>404 / LOST IN LEONIDA</p>
    <h1>Diese Straße endet im Nichts.</h1>
    <p>Die gesuchte Seite existiert nicht. Zurück zum Dashboard — dort warten Aktien, Krankenstand und DE-CIX-Traffic.</p>
    <a href="./">Zurück zum Dashboard</a>
  </div>
</body>
</html>
