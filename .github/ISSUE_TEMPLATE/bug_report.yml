name: Bug report
description: Something on the dashboard or in the collectors is broken.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Issues may be written in English or German. For security problems, please use a private report instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://huskynarr.is-a.dev/gta-dashboard/
        2. Switch language to EN
        3. ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Countdown / release dates
        - Market / stocks
        - Sick leave
        - Hype & OSINT
        - Network / DE-CIX
        - Peaks
        - Investor
        - Translations (DE/EN/FR)
        - Data collector / workflow
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, OS and country/language
      placeholder: Firefox 140, Windows 11, Germany / de-DE
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, console output or collector logs
      render: shell
